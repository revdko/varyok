<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Var Yok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Figtree:wght@400;600;800&display=swap">
<style>
/* Tek ekran kart masası: üstte rakipler, ortada deste/gösterge/yer, altta senin elin. Bilinçli olarak tek tema (yeşil çuha). */
:root{
  color-scheme: dark;
  --felt:#17463a; --felt-deep:#0f3329; --felt-line:#2a6553;
  --ivory:#f7f1e3; --ink:#1d1f24; --red:#b3262e;
  --brass:#d9a441; --brass-soft:#d9a44133;
  --text:#eef3ee; --muted:#a9c4b9;
  --good:#7fd19b; --bad:#f08a7e;
  --display:"Yeseva One", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cw:clamp(40px, 8.2vw, 64px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 35%, var(--felt) 0%, var(--felt-deep) 85%) fixed, var(--felt-deep);color:var(--text);font-family:var(--body);font-size:15px}
.wrap{max-width:980px;margin:0 auto;padding-block:14px 28px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,40px);margin:0;letter-spacing:.01em;color:var(--ivory)}
h1 span{color:var(--brass)}
h2{font-family:var(--display);font-weight:400;margin:0;font-size:22px;color:var(--ivory)}
.sub{color:var(--muted);font-size:13px}
button{touch-action:manipulation;font-family:var(--body);font-size:14px;font-weight:600;border-radius:8px;border:1px solid var(--felt-line);background:#ffffff10;color:var(--text);padding:9px 14px;cursor:pointer}
button:hover:not(:disabled){background:#ffffff1c}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--brass);color:var(--ink);border-color:var(--brass)}
button.primary:hover:not(:disabled){background:#e8b552}
button.yes{background:var(--good);color:var(--ink);border-color:var(--good)}
button.no{background:var(--bad);color:var(--ink);border-color:var(--bad)}
input{font-family:var(--body);font-size:16px;padding:10px 12px;border-radius:8px;border:1px solid var(--felt-line);background:#00000033;color:var(--text);min-width:0}
input::placeholder{color:var(--muted)}
.panel{display:grid;gap:16px;background:#00000026;border:1px solid var(--felt-line);border-radius:14px;padding:20px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input{flex:1 1 160px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
.rules{margin:0;padding-left:20px;color:var(--muted);line-height:1.55;max-width:65ch}
.rules b{color:var(--text)}
details summary{cursor:pointer;color:var(--brass);font-weight:600}
.code{font-family:var(--display);font-size:clamp(34px,9vw,52px);letter-spacing:.12em;color:var(--brass);line-height:1}
.link{font-size:13px;color:var(--muted);word-break:break-all}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--felt-line);border-radius:10px;background:#00000022}
.pitem .nm{font-weight:800}
.pitem button{padding:4px 10px;font-size:12px}
.notice{color:var(--bad);font-weight:600}
button.small{padding:5px 10px;font-size:12px}
header .row{gap:10px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:14px;border:1px solid var(--felt-line);background:#00000026;color:var(--text);text-decoration:none}
.tile .tile-k{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
.tile .tile-t{font-family:var(--display);font-size:24px;color:var(--ivory);line-height:1.15}
.tile > div > input{width:100%}
.tile .tile-d{color:var(--muted);line-height:1.5}
.tile.solo{background:linear-gradient(150deg,#d9a44126,#00000026);border-color:var(--brass);justify-content:center;min-height:180px;transition:transform .15s}
.tile.solo:hover{transform:translateY(-2px)}
.tile.solo:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.tile.solo::after{content:"Oyna →";align-self:flex-start;background:var(--brass);color:var(--ink);font-weight:800;padding:9px 16px;border-radius:8px;margin-top:4px}

/* opponents */
.opps{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.opp{border:1px solid var(--felt-line);border-radius:12px;padding:10px 12px;background:#00000022;display:flex;flex-direction:column;gap:6px;transition:box-shadow .2s,border-color .2s}
.opp.turn{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass-soft)}
.opp.out{opacity:.5}
.opp-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.opp-name{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opp-score{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;flex:none}
.chips{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.chip{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--felt-line);color:var(--muted)}
.chip.var{color:var(--ink);background:var(--good);border-color:var(--good)}
.chip.yok{color:var(--ink);background:var(--bad);border-color:var(--bad)}
.chip.zor{color:var(--ink);background:var(--brass);border-color:var(--brass)}
.chip.dealer{color:var(--brass);border-color:var(--brass)}
.chip.off{color:var(--bad);border-color:var(--bad)}
.backs{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.mini-back{width:18px;height:25px;border-radius:3px;background:repeating-linear-gradient(45deg,#7a1f28 0 4px,#93303a 4px 8px);border:2px solid var(--ivory)}

/* table center */
.center{display:flex;justify-content:center;align-items:flex-end;gap:clamp(18px,6vw,56px);flex-wrap:wrap;padding:8px 0}
.pile{display:flex;flex-direction:column;align-items:center;gap:6px}
.pile .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;text-align:center}
.pile .lbl b{color:var(--brass)}
.slot{width:calc(var(--cw) * 1.15);aspect-ratio:5/7;border:2px dashed var(--felt-line);border-radius:8px}
.back{width:calc(var(--cw) * 1.15);aspect-ratio:5/7;border-radius:8px;border:3px solid var(--ivory);background:repeating-linear-gradient(45deg,#7a1f28 0 6px,#93303a 6px 12px);display:grid;place-items:center;color:var(--ivory);font-weight:800;font-variant-numeric:tabular-nums;font-size:15px;text-shadow:0 1px 2px #0008;padding:0}
.clickable{cursor:pointer;box-shadow:0 0 0 3px var(--brass);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--brass-soft)}}
@media (prefers-reduced-motion: reduce){.clickable{animation:none}}

/* cards */
.card{width:var(--cw);aspect-ratio:5/7;background:var(--ivory);color:var(--ink);border-radius:7px;position:relative;box-shadow:0 2px 4px #0006;user-select:none;-webkit-user-select:none;border:none;padding:0;font-family:var(--display);flex:none}
.card.big{width:calc(var(--cw) * 1.15)}
button.card:disabled{opacity:1;cursor:default}
button.card:hover:not(:disabled){background:var(--ivory)}
.card.red{color:var(--red)}
.card .r{position:absolute;top:3px;left:5px;font-size:calc(var(--cw) * .3);line-height:1}
.card .s{position:absolute;top:calc(var(--cw) * .33);left:5px;font-size:calc(var(--cw) * .24);line-height:1;font-family:var(--body)}
.card .pip{position:absolute;right:5px;bottom:2px;font-size:calc(var(--cw) * .5);line-height:1;font-family:var(--body)}
.card.okey,button.card.okey:hover:not(:disabled){background:linear-gradient(160deg,#fff6d8,#f2d27a)}
.card.okey::after{content:"OKEY";position:absolute;bottom:-1px;left:0;right:0;text-align:center;font-family:var(--body);font-size:9px;font-weight:800;letter-spacing:.1em;color:#7a5410}
.card.okey .pip{display:none}
.hand .card{cursor:pointer;touch-action:none}
.hand .card.sel{box-shadow:0 0 0 3px var(--brass),0 0 14px 2px var(--brass)}
.hand .card.fresh{outline:2px dashed var(--brass);outline-offset:2px}
.hand .card.drop-before{box-shadow:-6px 0 0 0 var(--brass)}
.hand .card.drop-after{box-shadow:6px 0 0 0 var(--brass)}

.me{border-top:1px solid var(--felt-line);padding-top:12px;display:flex;flex-direction:column;gap:12px}
.me-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.prompt{font-size:16px;font-weight:600;min-height:1.4em}
.prompt .err{color:var(--bad)}
.hand{display:flex;flex-wrap:wrap;gap:6px;padding-top:14px;min-height:calc(var(--cw) * 1.4 + 14px)}
.hand .gap{width:12px;flex:none}
.pergroup{display:flex;gap:4px;padding:5px;border:2px solid var(--brass);border-radius:11px;background:#d9a4411f;position:relative}
.pergroup::before{content:"PER";position:absolute;top:-9px;left:8px;background:var(--felt);color:var(--brass);font-size:10px;font-weight:800;letter-spacing:.1em;padding:0 5px;border-radius:4px;line-height:16px}
.percount{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.percount b{color:var(--brass)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools .sp{flex:1}
.hint{font-size:12px;color:var(--muted);width:100%}
.log{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px;min-height:3.6em}
.log div:first-child{color:var(--text)}
.conn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom, 0px));background:var(--bad);color:var(--ink);font-weight:800;padding:8px 14px;border-radius:999px;z-index:40;font-size:13px}

/* modal */
.modal-bg{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--felt-deep);border:1px solid var(--brass);border-radius:14px;padding:20px;max-width:640px;width:100%;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal h2{font-size:26px}
.melds{display:flex;flex-wrap:wrap;gap:14px}
.meld{display:flex;gap:3px;padding:6px;border-radius:9px;background:#00000033}
.meld .card{--cw:clamp(34px,7vw,48px)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
td,th{padding:6px 8px;border-bottom:1px solid var(--felt-line);text-align:left}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right}
.plus{color:var(--good)} .minus{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="/core.js"></script>
<script>
const Core = window.VarYokCore;
const SUITS = ['♠','♥','♦','♣'];
const SUIT_NAMES = ['Maça','Kupa','Karo','Sinek'];
const RL = r => ({1:'A',11:'J',12:'Q',13:'K'}[r] || String(r));
const $app = document.getElementById('app');
const store = {
  get(k){ try{ return localStorage.getItem('varyok-'+k); }catch(e){ return null; } },
  set(k,v){ try{ if(v===null) localStorage.removeItem('varyok-'+k); else localStorage.setItem('varyok-'+k, v); }catch(e){} },
};

// İstemci durumu
let S = null;              // sunucudan gelen son durum
let ws = null, connected = false, wantRoom = null; // wantRoom: {t:'create'|'join', code}
let order = [];            // elimdeki kartların benim dizdiğim sırası (id listesi)
let selected = null, fresh = null, gaps = new Set(), msg = '', msgTimer = null, homeMsg = '';
let lastTap = {}, pd = null, suppressClick = false;

const params = new URLSearchParams(location.search);
let inviteCode = (params.get('oda') || '').toUpperCase();

// ---------- bağlantı ----------
function connect(){
  const proto = location.protocol==='https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);
  ws.onopen = () => { connected = true; if(wantRoom) sendJoin(); render(); };
  ws.onclose = () => { connected = false; render(); setTimeout(connect, 1500); };
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if(m.t==='joined'){ store.set('token', m.token); store.set('code', m.code); wantRoom={t:'join', code:m.code};
      const u = new URL(location.href); u.searchParams.set('oda', m.code); history.replaceState(null,'',u); }
    else if(m.t==='state'){ onState(m.s); }
    else if(m.t==='drawn'){ fresh = m.id; }
    else if(m.t==='error'){
      if(m.fatal){ const t=m.msg; goHome(); homeMsg=t; render(); }
      else flash(m.msg);
    }
  };
}
function sendJoin(){
  const name = store.get('name') || 'Oyuncu';
  send({t:wantRoom.t, code:wantRoom.code, name, token:store.get('token')});
}
function send(o){ if(ws && ws.readyState===1) ws.send(JSON.stringify(o)); }
function flash(t){ msg = `<span class="err">${t}</span>`; clearTimeout(msgTimer); msgTimer=setTimeout(()=>{ msg=''; render(); }, 4500); render(); }

function onState(s){
  const prevPhase = S && S.phase, prevHand = S && S.handNo;
  S = s;
  const ids = s.hand.map(c=>c.id);
  if(prevHand!==s.handNo || prevPhase==='lobby'){ order = sortedIds('suit'); gaps=new Set(); selected=null; fresh=null; }
  else {
    order = order.filter(id=>ids.includes(id));
    ids.forEach(id=>{ if(!order.includes(id)) order.push(id); });
  }
  if(selected!==null && !ids.includes(selected)) selected=null;
  if(fresh!==null && !ids.includes(fresh)) fresh=null;
  if(!(s.phase==='play' && s.turn===s.me && s.step==='discard')) fresh = null;
  render();
}

// ---------- yardımcılar ----------
const me = () => S.players[S.me];
const isHost = () => S && me() && S.hostId===me().id;
const isWild = c => Core.isWild(c, S.okeySuit);
const cardName = c => RL(c.rank)+SUITS[c.suit];
function myHand(){ const by=new Map(S.hand.map(c=>[c.id,c])); return order.map(id=>by.get(id)).filter(Boolean); }
function sortedIds(by){
  const h=[...S.hand], wk=c=>isWild(c)?1:0;
  if(by==='suit') h.sort((a,b)=>wk(a)-wk(b) || a.suit-b.suit || a.rank-b.rank);
  else h.sort((a,b)=>wk(a)-wk(b) || a.rank-b.rank || a.suit-b.suit);
  return h.map(c=>c.id);
}
function arrangeMelds(){
  const h=myHand(), best=Core.handValue(h, S.okeySuit);
  const {groups, rest}=Core.mapSlots(best.groups.map(g=>g.slots), h, S.okeySuit);
  const out=[]; gaps=new Set();
  groups.forEach(g=>{ if(g.length){ out.push(...g); gaps.add(g[g.length-1].id); } });
  rest.sort((a,b)=>(isWild(a)-isWild(b)) || a.suit-b.suit || a.rank-b.rank);
  out.push(...rest);
  order=out.map(c=>c.id); render();
}
function moveSel(d){
  const k=order.indexOf(selected); if(k<0) return;
  const t=k+d; if(t<0||t>=order.length) return;
  [order[k],order[t]]=[order[t],order[k]]; gaps=new Set(); render();
}
const myTurnDiscard = () => S && S.phase==='play' && S.turn===S.me && S.step==='discard';
const myTurnDraw = () => S && S.phase==='play' && S.turn===S.me && S.step==='draw';
const myBid = () => S && S.phase==='bid' && S.bidder===S.me;
function inviteLink(){ return `${location.origin}${location.pathname}?oda=${S.code}`; }
const esc = t => String(t).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

// ---------- çizim ----------
function cardHTML(c, extra='', attrs=''){
  const red = c.suit===1||c.suit===2, ok = S && isWild(c);
  return `<button class="card ${red?'red':''} ${ok?'okey':''} ${extra}" ${attrs} aria-label="${SUIT_NAMES[c.suit]} ${RL(c.rank)}${ok?' (okey)':''}"><span class="r">${RL(c.rank)}</span><span class="s">${SUITS[c.suit]}</span><span class="pip">${SUITS[c.suit]}</span></button>`;
}
function bidChip(p){
  if(p.bid==='out') return '<span class="chip">Elendi</span>';
  let h='';
  if(p.bid==='var') h='<span class="chip var">Varım</span>';
  else if(p.bid==='yok') h='<span class="chip yok">Yokum</span>';
  else if(p.bid==='zorunlu') h='<span class="chip zor">Zorunlu</span>';
  else if(S.phase==='bid') h='<span class="chip">Düşünüyor</span>';
  if(p.katla) h+='<span class="chip dealer">Katladı</span>';
  return h;
}
const RULES = `<ul class="rules">
  <li>104 kart (iki deste). Herkese ikişer ikişer, beş seferde <b>10 kart</b> dağıtılır. Göstergenin renginin <b>ası okeydir</b>.</li>
  <li>Dağıtanın sağındaki <b>zorunlu oynar</b> ve oyuna o başlar. Diğerleri <b>Varım</b>, <b>Katla</b> ya da <b>Yokum</b> der. Her katlama eli ikiye katlar: 10 → 20 → 40…</li>
  <li>Sırası gelen desteden ya da yerden kart alır, bir kart atar. 10 kartın hepsini pere dizip son kartını atan <b>açar</b>.</li>
  <li>Herkes <b>100 puanla</b> başlar. Açan, oyundaki diğer her oyuncudan el değeri kadar puan alır. Puanı sıfıra ya da eksiye düşen elenir.</li>
  <li>Herkes yokum derse ya da deste biterse el kapanır, yeni el dağıtılır.</li>
</ul>`;

function renderHome(){
  const name = store.get('name') || '';
  const saved = store.get('code');
  const wait = connected ? '' : 'disabled';
  $app.innerHTML = `
  <header><h1>Var <span>Yok</span></h1><div class="sub">Kartlı okey usulü · 104 kart · 3–6 kişi</div></header>
  ${homeMsg?`<p class="notice">${esc(homeMsg)}</p>`:''}
  ${inviteCode ? `
  <section class="panel invite">
    <div><h2>Masaya davet edildin</h2><p class="sub">Masa kodu: <b>${esc(inviteCode)}</b></p></div>
    <div><label for="nm">Adın</label><input id="nm" maxlength="16" placeholder="Masada görünecek adın" value="${esc(name)}" autocomplete="nickname"></div>
    <div class="row"><button class="primary" data-act="join-invite" id="join-inv" ${wait}>Masaya katıl</button><button data-act="home" id="cancel-inv">Vazgeç</button></div>
    ${connected?'':'<p class="sub">Sunucuya bağlanılıyor… (ilk açılışta yarım dakika sürebilir)</p>'}
  </section>` : `
  <section class="menu">
    <a class="tile solo" href="/tek.html" id="m-solo">
      <span class="tile-k">Tek kişilik</span>
      <span class="tile-t">Bilgisayara karşı oyna</span>
      <span class="tile-d">Hemen başla. İnternet bağlantısı beklemez.</span>
    </a>
    <div class="tile online">
      <span class="tile-k">Çevrimiçi</span>
      <span class="tile-t">Arkadaşlarınla oyna</span>
      <div><label for="nm">Adın</label><input id="nm" maxlength="16" placeholder="Masada görünecek adın" value="${esc(name)}" autocomplete="nickname"></div>
      ${saved ? `<button class="primary" data-act="resume" id="resume" ${wait}>Masana geri dön (${esc(saved)})</button>` : ''}
      <button class="${saved?'':'primary'}" data-act="create" id="create" ${wait}>Yeni masa kur</button>
      <div><label for="code">Arkadaşının masa koduyla katıl</label>
        <div class="row"><input id="code" maxlength="5" placeholder="Örn. K7MRA" style="text-transform:uppercase"><button data-act="join" id="join" ${wait}>Katıl</button></div></div>
      ${connected?'':'<p class="sub">Sunucuya bağlanılıyor… (ilk açılışta yarım dakika sürebilir)</p>'}
    </div>
  </section>`}
  <details class="panel"><summary>Nasıl oynanır</summary>${RULES}</details>`;
}

function leaveRoom(){
  if(S && S.phase!=='lobby' && S.phase!=='gameOver' && !me().out){
    if(!confirm('Masadan kalkarsan yerine bilgisayar oynayacak ve bu masaya geri dönemeyeceksin. Kalkmak istiyor musun?')) return;
  }
  send({t:'leave'});
  goHome();
}
function goHome(){
  wantRoom=null; S=null; order=[]; selected=null; msg=''; homeMsg='';
  store.set('code', null); store.set('token', null);
  history.replaceState(null,'',location.pathname);
  inviteCode='';
  render();
}

function renderLobby(){
  const host = isHost();
  const link = inviteLink();
  const wa = 'https://wa.me/?text=' + encodeURIComponent(`Var Yok masasına gel! ${link}`);
  const n = S.players.length;
  $app.innerHTML = `
  <header><h1>Var <span>Yok</span></h1><div class="row"><span class="sub">Bekleme salonu</span><button class="small" data-act="leave" id="leave">Masadan kalk</button></div></header>
  <section class="panel">
    <div><label>Masa kodu</label><div class="code">${S.code}</div></div>
    <div><label>Davet linki</label><div class="link" id="lnk">${esc(link)}</div></div>
    <div class="row">
      <button class="primary" data-act="copy" id="copy">Linki kopyala</button>
      <a href="${wa}" target="_blank" rel="noopener"><button tabindex="-1">WhatsApp'ta gönder</button></a>
    </div>
    <p class="sub">Linki arkadaşlarına gönder. Açınca adını yazıp bu masaya oturacaklar.</p>
  </section>
  <section class="panel">
    <h2>Masadakiler (${n}/${S.maxPlayers})</h2>
    <div class="plist">${S.players.map((p,i)=>`
      <div class="pitem"><span><span class="nm">${esc(p.name)}</span> ${i===S.me?'<span class="chip var">Sen</span>':''} ${p.id===S.hostId?'<span class="chip dealer">Masa sahibi</span>':''} ${p.bot?'<span class="chip">Bilgisayar</span>':''}</span>
      ${host&&p.bot?`<button data-act="rmbot" data-id="${p.id}">Çıkar</button>`:''}</div>`).join('')}
    </div>
    ${host ? `<div class="row">
        <button data-act="addbot" id="addbot" ${n>=S.maxPlayers?'disabled':''}>Bilgisayar oyuncu ekle</button>
        <span class="sp" style="flex:1"></span>
        <button class="primary" data-act="start" id="startg" ${n<S.minPlayers?'disabled':''}>Oyunu başlat</button></div>
        ${n<S.minPlayers?`<p class="sub">Başlamak için en az ${S.minPlayers} kişi gerekiyor. Arkadaşlarını bekle ya da bilgisayar oyuncu ekle.</p>`:''}`
      : `<p class="sub">Masa sahibinin oyunu başlatması bekleniyor…</p>`}
    ${msg?`<p class="prompt">${msg}</p>`:''}
  </section>
  <details class="panel"><summary>Nasıl oynanır</summary>${RULES}</details>`;
}

function renderGame(){
  const m = me(), n=S.players.length;
  const opps=[]; for(let k=1;k<n;k++) opps.push((S.me+k)%n);
  const oppsHTML = opps.map(i=>{
    const p=S.players[i];
    const out = p.out || p.bid==='yok';
    return `<div class="opp ${S.turn===i&&S.phase==='play'?'turn':''} ${S.bidder===i?'turn':''} ${out?'out':''}">
      <div class="opp-top"><span class="opp-name">${esc(p.name)}</span><span class="opp-score">${p.score} puan</span></div>
      <div class="chips">${S.dealer===i?'<span class="chip dealer">Dağıtan</span>':''}${bidChip(p)}${!p.bot&&!p.connected?'<span class="chip off">Bağlantı yok</span>':''}</div>
      <div class="backs"><span class="mini-back"></span>${p.count} kart</div>
    </div>`;
  }).join('');
  const canDraw = myTurnDraw();
  let prompt='';
  if(m.out) prompt='Oyundan elendin. Oyunu izleyebilirsin.';
  else if(myBid()) prompt = m.bid==='zorunlu'
    ? `Dağıtanın sağındasın, zorunlu oynuyorsun. Eli katlamak ister misin? (${S.stake} → ${S.stake*2} puan)`
    : `Kartlarına bak. Bu elde var mısın? Katlarsan el ${S.stake} yerine ${S.stake*2} puan olur.`;
  else if(canDraw) prompt='Sıra sende: desteden çek ya da yerdeki kartı al.';
  else if(myTurnDiscard()) prompt='Atacağın karta çift tıkla. Kalan 10 kart tam per oluyorsa kartı seçip <b>Aç</b>.';
  else if(S.phase==='bid') prompt = S.players[S.bidder] ? `İhale sürüyor: ${esc(S.players[S.bidder].name)} düşünüyor…` : 'İhale bitti…';
  else if(S.phase==='play' && S.players[S.turn]) prompt = (m.bid==='yok'?'Bu eli pas geçtin. ':'') + `${esc(S.players[S.turn].name)} oynuyor…`;
  else if(S.phase==='closing') prompt='El kapandı, yeni el dağıtılıyor…';
  else prompt='El bitti.';
  if(msg) prompt += `<br>${msg}`;

  const katlaBtn = `<button class="primary" data-act="bid" data-c="katla" id="b-katla">Katla ×2</button>`;
  const bidBtns = !myBid() ? '' : m.bid==='zorunlu'
    ? `${katlaBtn}<button class="yes" data-act="bid" data-c="normal" id="b-normal">Katlamadan oyna</button>`
    : `<button class="yes" data-act="bid" data-c="var" id="b-var">Varım</button>${katlaBtn}<button class="no" data-act="bid" data-c="yok" id="b-yok">Yokum</button>`;
  const sel = selected!==null;
  const hand = myHand();
  const one = c => cardHTML(c, `${selected===c.id?'sel':''} ${fresh===c.id?'fresh':''}`, `data-act="card" data-id="${c.id}"`);
  let handHTML='', inPer=0;
  for(const seg of Core.findPerSegments(hand, S.okeySuit)){
    if(seg.per){ inPer+=seg.cards.length; handHTML+=`<span class="pergroup">${seg.cards.map(one).join('')}</span>`; }
    else handHTML += seg.cards.map(c=>one(c)+(gaps.has(c.id)?'<span class="gap"></span>':'')).join('');
  }
  const tools = hand.length ? `
    <div class="hint">Desteye ya da yerdeki karta tıklayınca kart çekersin. Elindeki karta çift tıklayınca o kartı atarsın. Kartları sürükleyip istediğin gibi dizebilirsin.</div>
    <button data-act="sort-suit">Renge göre</button>
    <button data-act="sort-rank">Sayıya göre</button>
    <button data-act="arrange">Perlere göre diz</button>
    <button data-act="left" ${sel?'':'disabled'} aria-label="Seçili kartı sola taşı">◀</button>
    <button data-act="right" ${sel?'':'disabled'} aria-label="Seçili kartı sağa taşı">▶</button>
    <span class="sp"></span>${bidBtns}
    ${myTurnDiscard()?`<button data-act="discard" id="t-at" ${sel?'':'disabled'}>At</button><button class="primary" data-act="open" id="t-open" ${sel?'':'disabled'}>Aç</button>`:''}` : '';

  $app.innerHTML = `
  <header><h1>Var <span>Yok</span></h1>
    <div class="row"><span class="sub">Masa ${S.code} · ${S.handNo}. el · El değeri: <b>${S.stake}</b>${S.stake>10?` (katlamalı ×${S.stake/10})`:''} · Puanın: <b>${m.score}</b></span><button class="small" data-act="leave" id="leave">Masadan kalk</button></div>
  </header>
  <section class="opps">${oppsHTML}</section>
  <section class="center">
    <div class="pile">
      ${S.deckCount ? `<button class="back ${canDraw?'clickable':''}" data-act="deck" id="p-deck" ${canDraw?'':'disabled'} aria-label="Desteden çek">${S.deckCount}</button>` : '<div class="slot"></div>'}
      <div class="lbl">Deste</div>
    </div>
    <div class="pile">
      ${S.indicator ? cardHTML(S.indicator,'big','tabindex="-1" disabled') : '<div class="slot"></div>'}
      <div class="lbl">Gösterge<br>Okey: <b>A${SUITS[S.okeySuit]}</b></div>
    </div>
    <div class="pile">
      ${S.top ? cardHTML(S.top, `big ${canDraw?'clickable':''}`, `data-act="take" id="p-take" ${canDraw?'':'disabled'}`) : '<div class="slot"></div>'}
      <div class="lbl">Yer</div>
    </div>
  </section>
  <section class="me">
    <div class="me-top">
      <div class="prompt">${prompt}</div>
      <div class="chips">${hand.length?`<span class="percount">Perdeki kart: <b>${inPer}</b> / ${hand.length}</span>`:''}${S.dealer===S.me?'<span class="chip dealer">Dağıtan</span>':''}${bidChip(m)}</div>
    </div>
    <div class="hand" id="hand">${handHTML}</div>
    <div class="tools">${tools}</div>
    <div class="log">${S.log.map(l=>`<div>${esc(l)}</div>`).join('')}</div>
  </section>
  ${S.result && (S.phase==='handEnd'||S.phase==='gameOver') ? resultHTML() : ''}`;
}

function resultHTML(){
  const r=S.result, w=S.players[r.winner];
  const title = (r.winner===S.me ? 'Açtın, el senin!' : `${esc(w.name)} açtı`) + ` · ${r.stake} puanlık el`;
  const melds = `<div class="melds">${r.melds.map(g=>`<div class="meld">${g.map(c=>cardHTML(c,'','tabindex="-1"')).join('')}</div>`).join('')}</div>`;
  const rows = S.players.map((p,i)=>{
    const d = r.deltas[i]!==undefined ? r.deltas[i] : 0, b=r.bids[i];
    const bidTxt = b==='out'?'Elenmişti':b==='yok'?'Yokum':b==='zorunlu'?'Zorunlu':'Varım';
    return `<tr><td>${esc(p.name)}${i===S.me?' (sen)':''}${r.eliminated.includes(i)?' <span class="chip yok">Elendi</span>':''}</td><td>${bidTxt}</td><td class="num ${d>0?'plus':d<0?'minus':''}">${d>0?'+':''}${d}</td><td class="num"><b>${p.score}</b></td></tr>`;
  }).join('');
  let foot;
  if(S.phase==='gameOver') foot = isHost() ? `<button class="primary" data-act="again" id="again">Aynı masayla tekrar oyna</button>` : `<p class="sub">Masa sahibi yeni oyunu başlatabilir.</p>`;
  else {
    const sec = Math.max(0, Math.ceil((r.nextAt-Date.now())/1000));
    foot = `<p class="sub">Sonraki el <span id="cd">${sec}</span> saniye içinde başlayacak.</p>` + (isHost()?`<button class="primary" data-act="next" id="m-next">Hemen başlat</button>`:'');
  }
  return `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">
    <h2>${title}</h2>${melds}
    ${r.gameOver?`<p class="prompt">${esc(r.gameOver)}</p>`:''}
    <table><thead><tr><th>Oyuncu</th><th>İhale</th><th class="num">Bu el</th><th class="num">Toplam</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="tools">${foot}</div>
  </div></div>`;
}

function render(){
  if(!S) renderHome();
  else if(S.phase==='lobby') renderLobby();
  else renderGame();
  if(S && !connected) $app.insertAdjacentHTML('beforeend','<div class="conn">Bağlantı koptu, yeniden bağlanılıyor…</div>');
}
setInterval(()=>{ const cd=document.getElementById('cd'); if(cd && S && S.result && S.result.nextAt) cd.textContent=Math.max(0,Math.ceil((S.result.nextAt-Date.now())/1000)); }, 500);

// ---------- olaylar ----------
function saveName(){ const el=document.getElementById('nm'); const v=el?el.value.trim():''; if(!v){ homeMsg='Önce adını yaz.'; render(); return false; } store.set('name', v); homeMsg=''; return true; }
function doDiscard(id){ if(!myTurnDiscard()) return; send({t:'discard', id}); selected=null; }
$app.addEventListener('click', e=>{
  if(suppressClick) return;
  const el=e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const a=el.dataset.act;
  if(a==='create'){ if(!saveName()) return; store.set('token', null); wantRoom={t:'create'}; sendJoin(); }
  else if(a==='join'){ if(!saveName()) return; const c=document.getElementById('code').value.trim().toUpperCase(); if(!c){ homeMsg='Masa kodunu yaz.'; render(); return; } wantRoom={t:'join', code:c}; sendJoin(); }
  else if(a==='join-invite'){ if(!saveName()) return; if(store.get('code')!==inviteCode) store.set('token', null); wantRoom={t:'join', code:inviteCode}; sendJoin(); }
  else if(a==='copy'){
    const link=inviteLink();
    navigator.clipboard.writeText(link).then(()=>{ el.textContent='Kopyalandı'; }).catch(()=>{ const r=document.createRange(); r.selectNodeContents(document.getElementById('lnk')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); el.textContent='Seçildi, kopyala'; });
  }
  else if(a==='resume'){ if(!saveName()) return; wantRoom={t:'join', code:store.get('code')}; sendJoin(); }
  else if(a==='home') goHome();
  else if(a==='leave') leaveRoom();
  else if(a==='addbot') send({t:'addBot'});
  else if(a==='rmbot') send({t:'removeBot', id:el.dataset.id});
  else if(a==='start') send({t:'start'});
  else if(a==='again') send({t:'again'});
  else if(a==='next') send({t:'next'});
  else if(a==='bid') send({t:'bid', choice:el.dataset.c});
  else if(a==='deck') send({t:'draw', from:'deck'});
  else if(a==='take') send({t:'draw', from:'discard'});
  else if(a==='card'){
    const id=+el.dataset.id, now=Date.now();
    if(lastTap.id===id && now-lastTap.t<550 && myTurnDiscard()){ lastTap={}; doDiscard(id); return; }
    lastTap={id, t:now};
    selected = selected===id ? null : id; render();
  }
  else if(a==='discard'){ if(selected!==null) doDiscard(selected); }
  else if(a==='open'){ if(selected!==null && myTurnDiscard()) send({t:'open', id:selected}); }
  else if(a==='sort-suit'){ order=sortedIds('suit'); gaps=new Set(); render(); }
  else if(a==='sort-rank'){ order=sortedIds('rank'); gaps=new Set(); render(); }
  else if(a==='arrange') arrangeMelds();
  else if(a==='left') moveSel(-1);
  else if(a==='right') moveSel(1);
});
$app.addEventListener('dblclick', e=>{
  const el=e.target.closest('.hand [data-act="card"]');
  if(!el || !myTurnDiscard()) return;
  e.preventDefault(); doDiscard(+el.dataset.id);
});
$app.addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  if(e.target.id==='code') document.getElementById('join').click();
  if(e.target.id==='nm'){ const b=document.getElementById('join-inv')||document.getElementById('create'); if(b) b.click(); }
});

// Sürükle-bırak: fare ve dokunmatik ekranda çalışır
function clearDropMarks(){ document.querySelectorAll('.drop-before,.drop-after').forEach(x=>x.classList.remove('drop-before','drop-after')); }
function dropTarget(x,y){
  const under=document.elementFromPoint(x,y);
  const t=under && under.closest('.hand [data-act="card"]');
  if(t && (!pd || t!==pd.el)){ const r=t.getBoundingClientRect(); return {id:+t.dataset.id, el:t, after:x>r.left+r.width/2}; }
  const hand=document.getElementById('hand');
  if(hand){ const r=hand.getBoundingClientRect(); if(x>=r.left&&x<=r.right&&y>=r.top-20&&y<=r.bottom+20) return {end:true}; }
  return null;
}
$app.addEventListener('pointerdown', e=>{
  const el=e.target.closest('.hand [data-act="card"]'); if(!el || e.button>0) return;
  pd={id:+el.dataset.id, x:e.clientX, y:e.clientY, el, dragging:false};
});
window.addEventListener('pointermove', e=>{
  if(!pd) return;
  if(!pd.dragging){
    if(Math.hypot(e.clientX-pd.x, e.clientY-pd.y)<8) return;
    pd.dragging=true;
    const r=pd.el.getBoundingClientRect(), g=pd.el.cloneNode(true);
    g.classList.remove('sel','fresh');
    Object.assign(g.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',margin:0,zIndex:30,pointerEvents:'none',transform:'rotate(-4deg)',boxShadow:'0 10px 20px #0009'});
    document.body.appendChild(g);
    pd.ghost=g; pd.dx=pd.x-r.left; pd.dy=pd.y-r.top; pd.el.style.opacity='.3';
  }
  e.preventDefault();
  pd.ghost.style.left=(e.clientX-pd.dx)+'px'; pd.ghost.style.top=(e.clientY-pd.dy)+'px';
  clearDropMarks();
  const t=dropTarget(e.clientX,e.clientY);
  if(t && t.el) t.el.classList.add(t.after?'drop-after':'drop-before');
}, {passive:false});
function endDrag(e, cancel){
  if(!pd) return; const d=pd; pd=null;
  if(!d.dragging) return;
  d.ghost.remove(); clearDropMarks();
  suppressClick=true; setTimeout(()=>suppressClick=false,0);
  const t = cancel ? null : dropTarget(e.clientX,e.clientY);
  if(t){
    const from=order.indexOf(d.id); order.splice(from,1);
    if(t.end) order.push(d.id);
    else { let to=order.indexOf(t.id); if(t.after) to++; order.splice(to,0,d.id); }
    gaps=new Set();
  }
  render();
}
window.addEventListener('pointerup', e=>endDrag(e,false));
window.addEventListener('pointercancel', e=>endDrag(e,true));

// Sayfa yenilenirse aynı masaya geri dön
const savedCode = store.get('code');
// Sayfa yenilenince (adres çubuğunda masa kodu varken) aynı masaya kendiliğinden dön
if(savedCode && store.get('token') && inviteCode===savedCode) wantRoom={t:'join', code:savedCode};
render();
connect();
</script>
</body>
</html>
